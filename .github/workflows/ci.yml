name: Check repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} and portable skill
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            skills/vvv/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install local media tools for offline extraction tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Test local helpers and publication checks
        run: python -m unittest discover -s tests -v
      - name: Check published files and a standalone skill copy
        run: python scripts/check-repository.py --portable

  remotion:
    name: Remotion kit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kits/remotion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.8.2'
          cache: npm
          cache-dependency-path: kits/remotion/package-lock.json
      - name: Install locked kit dependencies
        run: npm ci
      - name: Typecheck, test, and verify packaged fonts
        run: npm run check
